name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Show build environment
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # 기존 스타일 권고는 출력하되 오류와 경고는 빌드를 중단한다.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # 배포 서명 없이 앱과 포함된 위젯의 Release 컴파일을 검증한다.
      - name: Build iOS without signing
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7
